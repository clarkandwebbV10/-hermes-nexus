name: Hidden Viper CI

on:
  push:
    branches: [main]
    paths:
      - "viper/**"
      - ".github/workflows/viper-ci.yml"
  pull_request:
    paths:
      - "viper/**"
      - ".github/workflows/viper-ci.yml"

jobs:
  test:
    # Keep Linux version coverage and verify replay bytes on real Windows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Hidden Viper tests
        run: python -m unittest discover -s viper/tests -v
