name: Viper CI

on:
  push:
    branches: [main]
    paths:
      - "viper/**"
      - ".github/workflows/viper-ci.yml"
  pull_request:
    paths:
      - "viper/**"
      - ".github/workflows/viper-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s viper/tests -v
