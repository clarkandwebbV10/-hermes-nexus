name: Hidden Viper Formal

on:
  push:
    branches: [main]
    paths:
      - "viper/formal/**"
      - ".github/workflows/hidden-viper-formal.yml"
  pull_request:
    paths:
      - "viper/formal/**"
      - ".github/workflows/hidden-viper-formal.yml"

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Lean toolchain
        working-directory: viper/formal
        run: |
          $HOME/.elan/bin/lean --version
          $HOME/.elan/bin/lake --version
          $HOME/.elan/bin/lake update
      - name: Build formal model
        working-directory: viper/formal
        run: $HOME/.elan/bin/lake build
