# One-time dependency remediation on an isolated security branch.
# Remove this workflow after its verified lockfile commit is recorded.
name: refresh-vite-lock-on-security-branch
on:
  push:
    branches:
      - security/vite-rce-20261119
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate lockfile without package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify resolved Vite is outside the known vulnerable 8.x ranges
        run: |
          node -e "const p=require('./package-lock.json'); const v=p.packages['node_modules/vite'].version; const n=v.split('.').map(Number); if(n[0]!==8 || n[1]<3 || (n[1]===3 && n[2]<8)){throw Error('Vite remains vulnerable: '+v)}; console.log('Patched Vite locked:',v)"
      - name: Verify reproducible install and production build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit tested lockfile to the isolated security branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "security: regenerate and verify patched Vite lockfile"
            git push origin HEAD:security/vite-rce-20261119
          fi
